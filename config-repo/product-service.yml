server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/commercex_product
    username: postgres
    password: root1234

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

    # Existing database already contains V1-V4 schema
    baseline-on-migrate: true
    baseline-version: 4

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s

      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 2s


eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: always


springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true


logging:
  level:
    root: INFO
    com.commercex: DEBUG

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      [%thread]
      %-5level
      [%X{X-Correlation-ID}]
      %logger{36}
      -
      %msg%n


otel:
  exporter:
    otlp:
      endpoint: http://${TEMPO_HOST:localhost}:4317