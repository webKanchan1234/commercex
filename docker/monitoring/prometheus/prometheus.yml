global:
  scrape_interval: 10s

  evaluation_interval: 10s


scrape_configs:

  # ============================
  # Product Service
  # ============================

  - job_name: "product-service"

    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "host.docker.internal:8082"

        labels:
          service: "product-service"
          environment: "local"


  # ============================
  # API Gateway
  # ============================

  - job_name: "api-gateway"

    metrics_path: "/actuator/prometheus"

    static_configs:
      - targets:
          - "host.docker.internal:8080"

        labels:
          service: "api-gateway"
          environment: "local"